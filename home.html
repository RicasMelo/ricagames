<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Tower</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main class="card">
        <h1>Word Tower</h1>
        <p class="subtitle">Enter the tower. Speak your power.</p>

        <!-- script.js owns login, registration, and routing to character/lobby pages. -->
        <section id="authBox" class="hidden">
            <input id="nickname" type="text" placeholder="Nickname" autocomplete="username" />
            <input id="password" type="password" placeholder="Password" />

            <button id="loginBtn">Login</button>
            <button id="registerBtn" class="secondary">Register</button>

            <p id="authMessage"></p>
        </section>

        <section id="loadingBox">
            <p>Checking identity...</p>
        </section>
    </main>

    <script type="module" src="script.js"></script>
</body>

</html>
